site_name: Java Concepts Reference
site_description: Source-driven Java syntax and concepts reference
repo_name: JavaConcepts
docs_dir: docs
site_dir: build/mkdocs
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
nav:
  - Home: index.md
  - Getting started:
      - Build and run: getting-started/building.md
      - Running documented examples: getting-started/running-examples.md
  - Syntax reference:
      - Overview: syntax/index.md
      - Language fundamentals: syntax/language-fundamentals.md
      - Operators: syntax/operators.md
      - Control flow: syntax/control-flow.md
      - Objects and interfaces: syntax/objects-and-interfaces.md
      - Generics: syntax/generics.md
      - Exceptions: syntax/exceptions.md
      - Lambdas: syntax/lambdas.md
      - Streams: syntax/streams.md
      - Date and time: syntax/date-time.md
      - Concurrency: syntax/concurrency.md
  - Repository audit:
      - Inventory: audit/repository-inventory.md
      - Retention report: audit/retention-report.md
      - Reorganization plan: audit/reorganization-plan.md
  - Appendix:
      - Source map: appendix/source-map.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
