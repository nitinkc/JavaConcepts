name: Deploy React and MkDocs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interview-labs/package-lock.json

      - name: Install application dependencies
        working-directory: interview-labs
        run: npm ci

      - name: Typecheck application
        working-directory: interview-labs
        run: npm run typecheck

      - name: Test application
        working-directory: interview-labs
        run: npm test

      - name: Lint application
        working-directory: interview-labs
        run: npm run lint

      - name: Build application
        working-directory: interview-labs
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Add documentation to application artifact
        run: |
          mkdir -p interview-labs/dist/docs
          cp -R site/. interview-labs/dist/docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: interview-labs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
