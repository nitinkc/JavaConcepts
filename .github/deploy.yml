name: Deploy Angular and MkDocs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: basics-components/package-lock.json

      - name: Install application dependencies
        working-directory: basics-components
        run: npm ci

      - name: Test application
        working-directory: basics-components
        run: npm test

      - name: Build application
        working-directory: basics-components
        run: npm run build -- --base-href /AngularUI-concepts/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Add documentation to application artifact
        run: |
          mkdir -p basics-components/dist/interview-labs/browser/docs
          cp -R site/. basics-components/dist/interview-labs/browser/docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: basics-components/dist/interview-labs/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
